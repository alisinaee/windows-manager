# Builds and runs the unit tests on every push and pull request.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode toolchain
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: swift test
