# Pushing a tag like v0.1.0-alpha.3 builds the app (ad-hoc signed, not notarized), the wm CLI zip and
# SHA256SUMS.txt, and publishes them as a GitHub release. Notes come from docs/release-notes/<tag>.md.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode toolchain
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          # The runner also has Command Line Tools; SwiftPM would load its mismatched Swift Testing plugin.
          [ -d /Library/Developer/CommandLineTools ] && sudo mv /Library/Developer/CommandLineTools /Library/Developer/CommandLineTools.off || true
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Build DMG and CLI
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"; V="${TAG#v}"
          scripts/package-dmg.sh
          swift build -c release --product wm
          mkdir -p dist
          cp build/WindowsManager-*.dmg "dist/WindowsManager-$V.dmg"
          (cd "$(swift build -c release --show-bin-path)" && zip -q -X "$GITHUB_WORKSPACE/dist/wm-$V-arm64.zip" wm)
          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/release-notes/$TAG.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          PRE=""; case "$TAG" in *alpha*|*beta*|*rc*) PRE="--prerelease";; esac
          gh release create "$TAG" $PRE --title "Windows Manager ${TAG#v}" --notes-file "$NOTES" dist/*
